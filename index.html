<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stad Bingo</title>
  <meta name="description" content="Verken de stad, claim opdrachten en win — een locatie-bingo spel voor families, kids en volwassenen.">
  <meta property="og:title" content="Stad Bingo">
  <meta property="og:description" content="Verken de stad, claim opdrachten en win.">
  <meta name="theme-color" content="#0e0d0b">
  <!-- Favicon: amber bingo grid -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230e0d0b'/><rect x='4' y='4' width='10' height='10' rx='2' fill='%23e89520'/><rect x='18' y='4' width='10' height='10' rx='2' fill='%23302c23'/><rect x='4' y='18' width='10' height='10' rx='2' fill='%23302c23'/><rect x='18' y='18' width='10' height='10' rx='2' fill='%23e89520'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">

  <!-- ── Setup screen ── -->
  <div id="setup" class="screen active">

    <header class="setup-header">
      <div class="setup-title"><span class="accent">STAD</span> BINGO</div>
      <p class="setup-sub">Verken de stad — claim opdrachten — win</p>
    </header>

    <div class="card">
      <div class="ct">Spelmodus</div>
      <div class="modes" id="mgrid"></div>
    </div>

    <div class="card">
      <div class="ct">Instellingen</div>
      <div class="row" style="gap:20px;flex-wrap:wrap">
        <div class="row">
          <span class="settings-label">Bord:</span>
          <input type="number" id="gsz" value="5" min="3" max="7">
          <span style="color:var(--muted)">×</span>
          <span id="glbl" style="font-family:'Orbitron',monospace;font-size:13px;font-weight:700">5</span>
        </div>
        <div class="row">
          <span class="settings-label">Vrij vakje:</span>
          <input type="checkbox" id="fsp" checked style="width:auto;accent-color:var(--acc);width:16px;height:16px">
        </div>
        <div class="row">
          <span class="settings-label">Timer:</span>
          <select id="tsel" style="width:auto">
            <option value="0">Geen timer</option>
            <option value="30">30 min</option>
            <option value="60" selected>60 min</option>
            <option value="90">90 min</option>
            <option value="120">2 uur</option>
            <option value="c">Eigen...</option>
          </select>
          <input type="number" id="tcust" value="45" min="5" max="300" style="width:68px;display:none">
          <span id="tcl" style="display:none;font-size:12px;color:var(--muted)">min</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="ct">Spelers / teams</div>
      <div id="plist"></div>
      <button class="btn bg2" onclick="addPlayer()" style="margin-top:4px">+ Speler toevoegen</button>
    </div>

    <div class="card" id="cc" style="display:none">
      <div class="ct">Eigen opdrachten — één per regel</div>
      <textarea id="citems" placeholder="Maak een selfie met een standbeeld&#10;Vraag iemand je te tekenen&#10;Bestel iets in een andere taal&#10;..."></textarea>
      <div style="font-size:12px;color:var(--muted);margin-top:6px" id="ccnt"></div>
    </div>

    <div id="serr"></div>
    <button class="btn bp bfull" onclick="startGame()">SPEL STARTEN</button>

  </div>

  <!-- ── Game screen ── -->
  <div id="game" class="screen">

    <div class="game-topbar">
      <div id="mlbl"></div>
      <div class="game-actions">
        <button class="btn bg2" style="padding:6px 12px;font-size:9px" onclick="toggleGallery()">📸 Foto's</button>
        <button class="btn br"  style="padding:6px 12px;font-size:9px" onclick="if(confirm('Spel stoppen?'))resetGame()">✕ Stop</button>
      </div>
    </div>

    <div id="tbar" style="display:none">
      <div id="tdsp">--:--</div>
      <div id="ttrack"><div id="tfill" style="width:100%"></div></div>
      <div id="tlbl"></div>
    </div>

    <div class="chips" id="pchips"></div>
    <div id="turnl"></div>
    <div id="board"></div>

    <div id="gal">
      <div class="ct" style="padding:3px 0">Gemaakte foto's</div>
      <div class="gg" id="gg"></div>
    </div>

  </div>

</main>

<!-- ── Claim modal ── -->
<div id="pmod" role="dialog" aria-modal="true" aria-labelledby="pbox-title">
  <div id="pbox">
    <h3 id="pbox-title">Opdracht claimen</h3>
    <div class="tt" id="ptxt"></div>
    <div id="pins"></div>
    <img id="pprev" src="" alt="Foto preview voor de opdracht">
    <input type="file" id="pfile" accept="image/*" capture="environment">
    <div class="pbr">
      <button class="btn bg2" onclick="closeClaimModal()">Annuleer</button>
      <button class="btn bp"  onclick="document.getElementById('pfile').click()" id="pshoot">📷 Foto kiezen</button>
      <button class="btn bgn" onclick="confirmClaim()" id="pconf" style="display:none">✓ Claim!</button>
    </div>
  </div>
</div>

<!-- ── Win overlay ── -->
<div id="wov" role="dialog" aria-modal="true" aria-labelledby="win-title">
  <div id="wbox">
    <h2 id="wtitle"></h2>
    <div class="wr" id="wreason"></div>
    <div class="pod" id="pod"></div>
    <button class="btn bp" onclick="resetGame()">NIEUW SPEL</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
